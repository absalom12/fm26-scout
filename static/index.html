    season: ['stat_score', ...SEASON.map(s => s[0])].filter(c => cols.has(c)),
    roles: ['best_role', 'best_role_score', ...Object.keys(META.roles).map(r => 'role_' + r)],
    contract: ['club_name', 'contract_squad_status', 'transfer_value', 'contract_wage', 'contract_end', 'months_left', 'on_loan', 'free_agent'],
  };
  const dealCols = LENSES.flatMap(l => [l.deal, l.ffee, l.fwage]);
  const all = ['star', ...new Set([...FIXED.slice(1), ...Object.values(VIEWS).flat(), ...Object.values(OVERVIEW).flat(), ...dealCols, ...LENSES.flatMap(l => l.ctx)])]
    .filter(c => c === 'star' || VIRTUAL.includes(c) || cols.has(c));
  try { const g = localStorage.getItem('fm26_gender'); if (g) setGender(g); } catch {}
  $('#positions').innerHTML = META.positions.map(p => `<button class="chip" data-pos="${p}" aria-pressed="false">${p}</button>`).join('');

  const PAGE_SIZES = [50, 100, 500, 1000];
  let PAGE_SIZE = 100;
  try { const n = +localStorage.getItem('fm26_page_size'); if (PAGE_SIZES.includes(n)) PAGE_SIZE = n; } catch {}
  grid = agGrid.createGrid($('#grid'), {
    columnDefs: all.map(colDef), defaultColDef: { sortable: true, resizable: true, floatingFilter: true, suppressHeaderMenuButton: true },
    rowModelType: 'infinite', cacheBlockSize: 100, maxBlocksInCache: 60, rowHeight: 40,
    pagination: true, paginationPageSize: PAGE_SIZE, paginationPageSizeSelector: PAGE_SIZES,
    onPaginationChanged: e => { if (e.newPageSize) try { localStorage.setItem('fm26_page_size', grid.paginationGetPageSize()); } catch {} }, headerHeight: 36, floatingFiltersHeight: 34,
    getRowId: p => String(p.data.uid),
    overlayNoRowsTemplate: emptyState('Nobody on the teamsheet', 'No players match these filters. Loosen one or reset.', '<button class="btn" onclick="resetAll()">Reset filters</button>'),
    // Click / Enter = quick view (drawer); with Shift = full profile page (middle-click too, see auxclick).
    onCellClicked: p => p.colDef.colId !== 'star' && p.data && !p.event?.target?.closest?.('.pname') && (p.event?.shiftKey ? openProfile(p.data.uid) : openPlayer(p.data.uid)),
    onCellKeyDown: p => p.event.key === 'Enter' && p.data && (p.colDef.colId === 'star' ? toggleStar(p.data.uid, p.data.name, p.data.club_uid) : p.event.shiftKey ? openProfile(p.data.uid) : openPlayer(p.data.uid)),
    onFilterChanged: renderSummary,
    datasource: { getRows: async p => {
      try {
        const r = await api('/api/players', query({ start: p.startRow, end: p.endRow, sort: p.sortModel, filters: p.filterModel }));
        if (!r.ok) throw r.status;
        const d = await r.json();
        total = d.total; renderSummary(); firstPageDone();
        d.total === 0 ? grid.showNoRowsOverlay() : grid.hideOverlay();
        p.successCallback(d.rows, d.total);
      } catch { p.failCallback(); toast('Could not load players. The server may be restarting.', 'bad'); }
    } },
  });
  renderViews(); renderLists(); renderLenses(); applyColumns(); renderSummary();
  // Back / forward: this tab's entry index survives a reload; the view itself starts fresh.
  const pq = +new URLSearchParams(location.search).get('p');  // a bookmarked or reloaded profile
  if (pq) { navRestoring = true; st.pp = pq; setPage('player'); navRestoring = false; }
  const hi = history.state?.i;
  try { navTop = hi == null ? 0 : Math.max(hi, +sessionStorage.getItem('fm26_nav_top') || 0); } catch {}
  history.replaceState({ ...navNow(), f: clone(F), i: hi ?? 0 }, ''); navArrows();
  // Load club in the background (after the first grid page: concurrent DuckDB queries can clash server-side).
  await firstPage;
  if (CLUB) return;
  api('/api/club' + mq()).then(r => r.ok ? r.json() : null).then(d => { if (d && !CLUB) { CLUB = d; formation = [...d.formation];
    let sv = null; try { sv = JSON.parse(localStorage.getItem('fm26_formation') || 'null'); } catch {}
    if (Array.isArray(sv) && sv.join() !== formation.join()) CLUB = null; else grid.refreshCells({ columns: ['name'], force: true }); } }).catch(() => {});
}

let qt;
const debounced = (fn, ms = 300) => { clearTimeout(qt); qt = setTimeout(fn, ms); };
$('#search').addEventListener('input', () => { if (st.page === 'club' || st.page === 'offers' || st.page === 'player') setPage('scout'); debounced(() => { refresh(); renderSummary(); }, 250); });
$$('.qf').forEach(el => el.addEventListener('input', () => { F[el.dataset.q] = el.value === '' ? null : Number(el.value); debounced(() => { renderSummary(); refresh(); }); }));
$('#reset').onclick = resetAll;
$('#exportBtn').onclick = exportCSV;
async function openLoad() {
  const d = $('#load'); if (d.open) return; d.showModal();
  let r = { folder_found: false, saves: [] };
  try { r = await (await api('/api/saves')).json(); } catch {}
  $('#loadSaves').innerHTML = r.saves.length
    ? r.saves.map(s => `<button type="button" class="btn" data-save="${esc(s.name)}"><span>${esc(s.name)}</span><span class="muted mono" style="font-size:12px">${Math.round(s.size / 1048576)} MB · ${new Date(s.mtime * 1000).toLocaleDateString()}</span></button>`).join('')
    : `<p class="note" style="margin:0">${r.folder_found ? 'No .fm save in the default FM26 folder.' : 'FM26 save folder not found.'} Drop the file above or browse to it.</p>`;
}
$('#loadBtn').onclick = openLoad;
$('#load').addEventListener('click', e => {
  const t = e.target, s = t.closest('[data-save]');
  if (t.closest('#dropZone')) $('#file').click();
  else if (s) { $('#load').close(); loadNamed(s.dataset.save); }
  else if (t.closest('[data-load-close]') || t === $('#load')) $('#load').close();
});
['dragenter', 'dragover'].forEach(ev => $('#dropZone').addEventListener(ev, () => $('#dropZone').classList.add('over')));
['dragleave', 'drop'].forEach(ev => $('#dropZone').addEventListener(ev, () => $('#dropZone').classList.remove('over')));
$('#file').onchange = e => upload(e.target.files[0]);
$('#palBtn').onclick = () => openPalette();
$('#esBtn').onclick = () => META && openES();

document.addEventListener('click', e => {
  const pn = e.target.closest('.pname[data-profile]');  // a player's name, anywhere: straight to his full profile
  if (pn) { e.stopPropagation(); return openProfile(+pn.dataset.profile); }
  const t = e.target.closest('button'); if (!t || t.closest('#es')) return;
  const d = t.dataset;
  if (t.id === 'navBack') history.back();
  else if (t.id === 'navFwd') history.forward();
  else if (d.page && t.closest('.nav')) setPage(d.page);
  else if (t.id === 'fairBtn') setFair(!FAIR);
  else if (d.mode && t.closest('#modes')) { if (META && d.mode !== MODE) setMode(d.mode); }
  else if (d.g != null && t.closest('#gender')) { setGender(d.g); refresh(); if (st.page === 'club' && CLUB) loadRecos(); }
  else if (d.pos && t.closest('#positions')) { F.positions = F.positions.includes(d.pos) ? F.positions.filter(x => x !== d.pos) : [...F.positions, d.pos]; renderSummary(); refresh(); }
  else if (d.list) pickList(d.list);
  else if (d.view) { st.view = d.view; renderViews(); applyColumns(); }
  else if (d.lens) pickLens(d.lens);
  else if (d.openPal != null) openPalette();
  else if (d.esOpen != null) openES();
  else if (d.crit != null) { critList()[+d.crit]?.[1](); renderSummary(); refresh(); }
  else if (d.close != null) closeDrawer();
  else if (d.i != null && t.closest('#palList')) runPal(+d.i);
  else if (d.star && !t.closest('.ag-cell')) { const p = drawerPlayer && drawerPlayer.uid === +d.star ? drawerPlayer : null;
    toggleStar(+d.star, p ? p.name : d.name, p ? p.club_uid : (d.club === '' ? null : +d.club)); }
  else if (d.offer) { const p = shown(+d.offer); closeDrawer(); setPage('offers'); pickOfferPlayer(p); }
  else if (d.similar) { const p = shown(+d.similar); if (p) findSimilar(p); }
  else if (d.profile) openProfile(+d.profile);
  else if (d.ofi != null) pickOfferPlayer(of.list[+d.ofi]);
  else if (d.offee) { $('#ofFee').value = money(+d.offee).replace('£', ''); evalOffer(); }
  else if (d.ofwage) { $('#ofWage').value = wage(+d.ofwage).replace(/^£|\/w$/g, ''); evalOffer(); }
  else if (d.player) e.shiftKey ? openProfile(+d.player) : openPlayer(+d.player);
  else if (d.slot != null) selectSlot(+d.slot);
  else if (d.clearSlot != null) selectSlot(null);
  else if (d.posEdit != null) { posEdit = !posEdit; renderSlotCard(); }
  else if (d.setpos) { if (formation[slotSel] === d.setpos) return; formation[slotSel] = d.setpos; renderClub(); refetchClub(); }
  else if (d.reco) { recoTab = d.reco; $$('[data-reco]').forEach(b => b.setAttribute('aria-pressed', b === t)); renderScope(); loadRecos(); }
  else if (t.id === 'clubRetry') { CLUB = null; loadClub(true); }
});
// Middle-click on a player (grid row, My Club, Offers, similar list) opens his full profile page.
const PLAYER_SEL = '[data-player], [data-profile], #grid .ag-row[row-id]';
document.addEventListener('mousedown', e => { if (e.button === 1 && e.target.closest(PLAYER_SEL)) e.preventDefault(); });  // no autoscroll
document.addEventListener('auxclick', e => {
  if (e.button !== 1) return;
  const t = e.target.closest(PLAYER_SEL); if (!t) return;
  const uid = +(t.dataset.player || t.dataset.profile || t.getAttribute('row-id'));
  if (uid) { e.preventDefault(); openProfile(uid); }
});
document.addEventListener('change', e => {
  if (e.target.id === 'cShape') { formation = [...shapes()[e.target.value]]; slotSel = null; renderClub(); refetchClub(); }
});
document.addEventListener('input', e => {
  if (['cBudget', 'cWage', 'cAge'].includes(e.target.id)) { clearTimeout(recoT); recoT = setTimeout(loadRecos, 400); }
  if (e.target.id === 'ofSearch') offerSearch();
  if (e.target.id === 'ofFee' || e.target.id === 'ofWage') evalOffer();
});
$('#offers').addEventListener('keydown', e => {
  if (e.target.id !== 'ofSearch' || !of.list.length) return;
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); of.idx = (of.idx + (e.key === 'ArrowDown' ? 1 : -1) + of.list.length) % of.list.length; renderAC(); }
  else if (e.key === 'Enter') { e.preventDefault(); pickOfferPlayer(of.list[of.idx]); }
  else if (e.key === 'Escape') { e.stopPropagation(); of.list = []; $('#ofList').innerHTML = ''; }
});

// Edit search dialog events
$('#es').addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t || !D) return;
  const d = t.dataset;
  if (d.esClose != null) $('#es').close();
  else if (d.espers) {
    const k = 'personality_' + d.espers, box = $('#esBody'), top = box.scrollTop;
    if (d.espers === 'controversy') { if (persOn(D, d.espers)) delete D.max[k]; else D.max[k] = 5; }
    else if (persOn(D, d.espers)) delete D.min[k]; else D.min[k] = 15;
    renderES(); $('#esBody').scrollTop = top; return;
  }
  else if (d.espos) { D.positions = D.positions.includes(d.espos) ? D.positions.filter(x => x !== d.espos) : [...D.positions, d.espos]; $$(`#es [data-espos="${d.espos}"]`).forEach(b => b.setAttribute('aria-pressed', D.positions.includes(d.espos))); esLive(); }
  else if (d.esgo) { const s = $(`#es [data-sec="${d.esgo}"]`), b = $('#esBody');
    b.scrollTo({ top: s.offsetTop, behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' }); s.querySelector('h3').focus({ preventScroll: true }); }
  else if (d.esrm != null) { const i = +d.esrm, top = $('#esBody').scrollTop; esCrit[i]?.[1](); renderES(); $('#esBody').scrollTop = top;
    ($(`#esStrip [data-esrm="${Math.min(i, esCrit.length - 1)}"]`) || $('#esRail button'))?.focus(); }
  else if (d.esg != null) { D.gender = d.esg; $$('[data-esg]').forEach(b => b.setAttribute('aria-pressed', b === t)); esLive(); }
  else if (d.esnatRm) { D.nations = D.nations.filter(x => x !== d.esnatRm); renderES(); }
  else if (d.esload != null) { D = { ...F0(), ...clone(saved[+d.esload].f) }; $('#esName').value = saved[+d.esload].name; renderES(); }
  else if (d.esdel != null) { saved.splice(+d.esdel, 1); saveSearches(); renderES(); }
  else if (t.id === 'esApply') applyES();
  else if (t.id === 'esClear') { D = F0(); renderES(); }
  else if (t.dataset.esshift) {  // only the attribute minimums already set; 1-20 scale, never cleared by a shift
    const k = +t.dataset.esshift;
    Object.keys(D.min).filter(c => c.startsWith('attributes_')).forEach(c => { D.min[c] = Math.min(20, Math.max(1, D.min[c] + k)); });
    const top = $('#esBody').scrollTop; renderES(); $('#esBody').scrollTop = top;
  }
  else if (t.id === 'esSave') { const n = $('#esName').value.trim(); if (!n) { $('#esName').focus(); $('#esName').setAttribute('aria-invalid', 'true'); return; }
    $('#esName').removeAttribute('aria-invalid');
    const f = clone(D); delete f.gender; saved = [...saved.filter(s => s.name !== n), { name: n, f }]; saveSearches(); renderES(); toast(`Saved search “${n}”`, 'good'); }
});
$('#es').addEventListener('input', e => {
  const t = e.target, d = t.dataset;
  if (!D || t.id === 'esName') return;
  if (t.id === 'esNatQ') { const pos = t.selectionStart; renderES(); const q = $('#esNatQ'); q.focus(); q.setSelectionRange(pos, pos); return; }
  if (d.esf) D[d.esf] = d.esf === 'squad' || d.esf === 'club_country' ? t.value : esNum(t.value);
  else if (d.esminm) { const v = esNum(t.value); if (v == null) delete D.min[d.esminm]; else D.min[d.esminm] = v; }
  else if (d.esb) D[d.esb] = t.checked;
  else if (d.esnat) { D.nations = t.checked ? [...D.nations, d.esnat] : D.nations.filter(x => x !== d.esnat); }
  else if (d.esmin) { if (t.value === '') delete D.min[d.esmin]; else D.min[d.esmin] = Number(t.value); }
  else if (d.esmax) { if (t.value === '') delete D.max[d.esmax]; else D.max[d.esmax] = Number(t.value); }
  else if (d.rmin || d.rmax) {
    const isMax = d.rmax != null, col = d.rmin || d.rmax, v = Number(t.value), off = isMax ? v >= Number(t.max) : v <= 0;
    if (off) delete (isMax ? D.max : D.min)[col]; else (isMax ? D.max : D.min)[col] = v;
    const tile = t.closest('.rg'), max = Number(t.max);
    tile.querySelector('output').textContent = off ? '–' : v; tile.classList.toggle('on', !off); tile.classList.toggle('top', !off && !isMax && v >= max);
    tile.dataset.t = off ? '' : tierOf(v, max, isMax); tile.style.setProperty('--v', v / max); t.setAttribute('aria-valuetext', off ? 'any' : v);
  }
  else if (d.dlo || d.dhi) {  // dual range: thumbs never cross; a thumb at the end of the scale clears that bound
    const id = d.dlo || d.dhi, [lk, hk, mn, mx, u] = DUAL[id], tr = t.parentElement, [a, b] = tr.querySelectorAll('input');
    let lo = +a.value, hi = +b.value;
    if (lo > hi) { if (d.dlo) a.value = lo = hi; else b.value = hi = lo; }
    dset(lk, lo <= mn ? null : lo); dset(hk, hi >= mx ? null : hi);
    const L = dget(lk), H = dget(hk), o = tr.previousElementSibling.querySelector('output');
    tr.style.setProperty('--lo', dualPct(id, lo)); tr.style.setProperty('--hi', dualPct(id, hi)); a.style.zIndex = lo > (mn + mx) / 2 ? 3 : 1;
    a.setAttribute('aria-valuetext', L ?? 'any'); b.setAttribute('aria-valuetext', H ?? 'any');
    o.textContent = dualTxt(L, H, u); o.classList.toggle('on', L != null || H != null);
  }
  esLive();
});
$('#es').addEventListener('change', e => { if (D && e.target.dataset.esnat) renderES(); });
$('#es').addEventListener('close', () => { D = null; });
$('#esBody').addEventListener('scroll', esSpy, { passive: true });
$('#esForm').addEventListener('submit', e => { e.preventDefault(); if (D) applyES(); });

$('#palQ').addEventListener('input', () => { palIdx = 0; renderPalette(); });
$('#palQ').addEventListener('keydown', e => {
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); palIdx = (palIdx + (e.key === 'ArrowDown' ? 1 : -1) + palItems.length) % Math.max(1, palItems.length); renderPalette(); }
  else if (e.key === 'Enter') { e.preventDefault(); runPal(palIdx); }
});
$('#palList').addEventListener('mousemove', e => { const b = e.target.closest('[data-i]'); if (b && +b.dataset.i !== palIdx) { palIdx = +b.dataset.i; $$('.pal-item').forEach(x => { x.classList.toggle('on', x === b); x.setAttribute('aria-selected', x === b); }); } });
$('#pal').addEventListener('click', e => { if (e.target === $('#pal')) $('#pal').close(); });

document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.matches?.('.pname[data-profile]')) { e.preventDefault(); return openProfile(+e.target.dataset.profile); }
  if ($$('dialog[open]').length) return;
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); openPalette(); return; }
  if (e.key === 'Escape') { closeDrawer(); return; }
  const typing = /^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement?.tagName);
  if (typing || e.metaKey || e.ctrlKey || e.altKey || !META) return;
  if (e.key === '/') { e.preventDefault(); $('#search').focus(); }
  else if (e.key === '1') setPage('scout'); else if (e.key === '2') { if (FAIR) setPage('deals'); } else if (e.key === '3') setPage('club'); else if (e.key === '4') setPage('offers');
  else if (e.key === 'e') { e.preventDefault(); openES(); }
  else if (e.key === 's' && (drawerPlayer || st.page === 'player' && ppPlayer)) { const p = drawerPlayer || ppPlayer; toggleStar(p.uid, p.name, p.club_uid); }
});

let depth = 0;
document.addEventListener('dragenter', e => { if (![...(e.dataTransfer?.types || [])].includes('Files')) return; e.preventDefault(); depth++; $('#overlay').hidden = false; });
document.addEventListener('dragleave', () => { if (--depth <= 0) { depth = 0; $('#overlay').hidden = true; } });
document.addEventListener('dragover', e => e.preventDefault());
document.addEventListener('drop', e => { e.preventDefault(); depth = 0; $('#overlay').hidden = true; upload(e.dataTransfer.files[0]); });
const ping = () => fetch('/api/ping', { method: 'POST' }).catch(() => {});
ping(); setInterval(ping, 5000);
setFair(FAIR);
addEventListener('pagehide', () => navigator.sendBeacon('/api/bye'));
init();
checkUpdate();
</script>
