<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scout26</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath fill='%233d9bff' d='M19.1 3 47.1 3 53 10 52.4 14 28.4 14 27 22.5 16 22.5Z'/%3E%3Cpath fill='%232fe08a' d='M15.4 26.5 50.4 26.5 48.6 37.5 13.6 37.5Z'/%3E%3Cpath fill='%23ffc93c' d='M37 41.5 48 41.5 44.9 61 9.9 61 10.5 57 18.6 50 35.6 50Z'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Scout26 — "Floodlit Touchline": night-match slate, Rovers-blue accent, condensed sports type. */
:root {
  --bg: #0b0f13; --bg2: #0e1318; --panel: #121920; --raise: #18212a; --hover: #1d2832; --line: #222d38; --line2: #2c3946;
  --text: #e8eef3; --text2: #b6c3ce; --muted: #8796a5; --faint: #56636f;
  --accent: #4aa3ff; --accent-ink: #03111f; --accent-soft: rgba(74,163,255,.13);
  --good: #3fd98a; --ok: #c3d651; --warn: #f2b84b; --bad: #ff6f6f; --gold: #f5c542;
  --good-soft: rgba(63,217,138,.13); --warn-soft: rgba(242,184,75,.13); --bad-soft: rgba(255,111,111,.13);
  --pitch: #0f2619; --pitch2: #11301f;
  --r-sm: 6px; --r: 10px; --r-lg: 14px; --r-pill: 999px;
  --shadow: 0 18px 50px rgba(0,0,0,.5);
  --ease: cubic-bezier(.2,.8,.2,1); --t-fast: 120ms; --t: 200ms; --t-slow: 360ms;
  --f-body: 'Barlow', system-ui, sans-serif; --f-display: 'Barlow Condensed', 'Barlow', sans-serif; --f-mono: 'JetBrains Mono', ui-monospace, monospace;
  --top: 52px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { font: 14px/1.4 var(--f-body); background: var(--bg); color: var(--text); display: flex; flex-direction: column; overflow: hidden; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
kbd { font: 600 10px var(--f-mono); color: var(--muted); border: 1px solid var(--line2); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; line-height: 15px; }
::-webkit-scrollbar { width: 8px; height: 8px; } ::-webkit-scrollbar-thumb { background: #26323d; border-radius: 4px; } ::-webkit-scrollbar-track { background: transparent; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* ---------- Header ---------- */
.top { height: var(--top); flex-shrink: 0; display: flex; align-items: center; gap: 14px; padding: 0 16px; background: var(--panel); border-bottom: 1px solid var(--line); position: relative; }
.brand { display: flex; align-items: center; gap: 8px; font: 700 20px/1 var(--f-display); letter-spacing: .02em; text-transform: uppercase; white-space: nowrap; }
.brand b { color: var(--accent); }
.brand svg { width: 28px; height: 28px; }
.nav { display: flex; gap: 2px; background: var(--bg); border: 1px solid var(--line); border-radius: var(--r); padding: 3px; }
.nav button { display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 12px; border-radius: 7px; font: 600 15px var(--f-display); letter-spacing: .04em; text-transform: uppercase; color: var(--muted); transition: color var(--t-fast), background var(--t-fast); }
.nav button:hover { color: var(--text); }
.nav button[aria-current="page"] { background: var(--raise); color: var(--text); box-shadow: inset 0 -2px 0 var(--accent); }
.search { position: relative; flex: 1; max-width: 380px; min-width: 160px; }
.search input { width: 100%; height: 36px; background: var(--bg); border: 1px solid var(--line); border-radius: var(--r); padding: 0 34px 0 34px; outline: none; transition: border-color var(--t-fast); }
.search input:focus { border-color: var(--accent); }
.search svg { position: absolute; left: 11px; top: 10px; width: 16px; height: 16px; color: var(--muted); }
.search kbd { position: absolute; right: 10px; top: 10px; }
.spacer { flex: 1; }
.btn { display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px; border-radius: var(--r); border: 1px solid var(--line); background: var(--bg); font-weight: 600; white-space: nowrap; transition: border-color var(--t-fast), background var(--t-fast), transform var(--t-fast); }
.btn:hover { border-color: var(--line2); background: var(--raise); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { background: #6db5ff; }
.btn[disabled] { opacity: .85; cursor: progress; }
.btn svg { width: 16px; height: 16px; }
.seg { display: inline-flex; background: var(--bg); border: 1px solid var(--line); border-radius: var(--r); padding: 3px; gap: 2px; }
.seg button { height: 28px; padding: 0 10px; border-radius: 7px; font-weight: 600; font-size: 13px; color: var(--muted); white-space: nowrap; transition: background var(--t-fast), color var(--t-fast); }
.seg button:hover { color: var(--text); }
.seg button[aria-pressed="true"] { background: var(--raise); color: var(--text); box-shadow: inset 0 0 0 1px var(--line2); }
.progress { position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; overflow: hidden; display: none; }
.progress.on { display: block; }
.progress::after { content: ""; position: absolute; inset: 0; width: 30%; background: linear-gradient(90deg, transparent, var(--accent), transparent); animation: slide 1.2s linear infinite; }
@keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(400%); } }
.spin { width: 14px; height: 14px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: rot .8s linear infinite; }
@keyframes rot { to { transform: rotate(360deg); } }

/* ---------- Data modes ---------- */
body { --mode: var(--accent); }
body.mode-fair { --mode: var(--good); } body.mode-moneyball { --mode: var(--gold); }
.top { box-shadow: inset 0 -2px 0 color-mix(in srgb, var(--mode) 55%, transparent); }
.modes button[aria-pressed="true"] { background: color-mix(in srgb, var(--mode) 18%, transparent); color: var(--mode); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--mode) 55%, transparent); }
.mode-chip { font: 700 11px var(--f-display); letter-spacing: .1em; text-transform: uppercase; color: var(--mode); border: 1px solid color-mix(in srgb, var(--mode) 50%, transparent); border-radius: 4px; padding: 1px 6px; margin-right: 6px; }
.tip { position: relative; }
.tip::after { content: attr(data-tip); position: absolute; top: calc(100% + 10px); right: 0; width: 260px; padding: 10px 12px; border-radius: var(--r); background: var(--raise); border: 1px solid var(--line2); box-shadow: var(--shadow); color: var(--text2); font: 400 13px/1.45 var(--f-body); text-align: left; white-space: normal; opacity: 0; pointer-events: none; transform: translateY(-4px); transition: opacity var(--t-fast), transform var(--t-fast); z-index: 60; }
.tip:hover::after, .tip:focus-visible::after { opacity: 1; transform: none; transition-delay: .25s; }
.count { font: 700 11px var(--f-mono); background: var(--accent); color: var(--accent-ink); border-radius: var(--r-pill); padding: 0 6px; }
.count:empty { display: none; }
.crit { min-height: 40px; padding: 6px 16px; gap: 6px; flex-wrap: wrap; background: var(--bg); }
.crit-chip { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 4px 0 10px; border-radius: var(--r-pill); background: var(--accent-soft); color: var(--text); font-size: 12px; font-weight: 600; }
.crit-chip button { width: 22px; height: 22px; border-radius: 50%; color: var(--muted); }
.crit-chip button:hover { background: var(--raise); color: var(--text); }
/* Nationality */
.nat { display: inline-flex; align-items: center; gap: 6px; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.flag { font-size: 15px; line-height: 1; font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif; }
/* Key attribute / stat chips */
.kchips { display: inline-flex; gap: 4px; overflow: hidden; vertical-align: middle; align-items: center; }
.ac { display: inline-flex; gap: 4px; align-items: baseline; font: 600 11px var(--f-display); letter-spacing: .04em; color: var(--muted); background: #151e27; border-radius: 4px; padding: 1px 6px; white-space: nowrap; }
.ac b { font: 700 12px var(--f-mono); }
.ac.st b { color: var(--text); }
.wage-hi { color: var(--warn); font-weight: 700; }
.wage-hi { color: var(--warn); font-weight: 700; }
/* ---------- Page visibility ---------- */
body[data-page="club"] .only-grid, body[data-page="offers"] .only-grid, body[data-page="player"] .only-grid, body:not([data-page="player"]) .only-player,body:not([data-page="scout"]) .only-scout, body:not([data-page="deals"]) .only-deals, body:not([data-page="club"]) .only-club, body:not([data-page="offers"]) .only-offers { display: none !important; }
.crit[hidden] { display: none !important; }
body.no-deals[data-page="deals"] #grid { display: none; }
body:not(.no-deals) #dealsMissing { display: none; }
body.no-fair .nav [data-page="deals"] { display: none; }

/* ---------- Filter bar ---------- */
.bar { flex-shrink: 0; display: flex; align-items: center; gap: 14px; padding: 8px 16px; border-bottom: 1px solid var(--line); background: var(--bg2); min-height: 52px; }
.bar.sub { background: var(--bg); min-height: 50px; gap: 8px; }
.chips { display: flex; gap: 4px; flex-wrap: wrap; }
.chip { height: 30px; min-width: 38px; padding: 0 10px; border-radius: var(--r-pill); border: 1px solid var(--line2); font: 600 13px var(--f-display); letter-spacing: .05em; color: var(--text2); transition: all var(--t-fast); }
.chip:hover { border-color: var(--muted); color: var(--text); }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.fld { display: inline-flex; align-items: center; gap: 6px; font: 600 12px var(--f-display); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
.fld input, .fld select, .in { height: 30px; background: var(--bg); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 0 8px; outline: none; font: 500 13px var(--f-mono); color: var(--text); text-transform: none; letter-spacing: 0; transition: border-color var(--t-fast); }
.fld input { width: 54px; }
.fld input:focus, .fld select:focus, .in:focus { border-color: var(--accent); }
.fld input.has, .fld select.has { border-color: rgba(74,163,255,.55); background: var(--accent-soft); }
.in[aria-invalid="true"] { border-color: var(--bad); }
.check { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text2); cursor: pointer; white-space: nowrap; }
.check input { width: 16px; height: 16px; accent-color: var(--accent); }
.link { color: var(--muted); font-weight: 600; font-size: 13px; padding: 6px 4px; }
.link:hover { color: var(--accent); }
.link b { color: var(--accent); }
.summary { margin-left: auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); font-size: 13px; }
.summary b { color: var(--text); font-family: var(--f-mono); }
.list-chip { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border-radius: var(--r-pill); border: 1px solid var(--line); font-weight: 600; font-size: 13px; color: var(--text2); white-space: nowrap; transition: all var(--t-fast); }
.list-chip:hover { border-color: var(--line2); color: var(--text); background: var(--raise); }
.list-chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--text); }
.list-chip .x { color: var(--muted); margin-left: 2px; }
.list-chip .n { font: 600 11px var(--f-mono); color: var(--gold); }
.views { margin-left: auto; }

/* Deal lens switch */
.lenses { display: flex; gap: 6px; }
.lens { text-align: left; padding: 6px 14px; border-radius: var(--r); border: 1px solid var(--line); min-width: 150px; transition: all var(--t-fast); }
.lens b { display: block; font: 700 16px/1.1 var(--f-display); letter-spacing: .04em; text-transform: uppercase; }
.lens span { font-size: 12px; color: var(--muted); }
.lens:hover { border-color: var(--line2); background: var(--raise); }
.lens[aria-pressed="true"] { border-color: var(--good); background: var(--good-soft); }
.lens[aria-pressed="true"] b { color: var(--good); }
.legend { margin-left: auto; display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--muted); }

/* ---------- Grid ---------- */
.main { flex: 1; min-height: 0; display: flex; flex-direction: column; position: relative; }
#grid { flex: 1; min-height: 0; }
body .ag-theme-quartz-dark {
  --ag-background-color: var(--bg); --ag-header-background-color: var(--bg2); --ag-odd-row-background-color: var(--bg);
  --ag-row-hover-color: #141d26; --ag-border-color: var(--line); --ag-row-border-color: #172029; --ag-header-foreground-color: var(--muted);
  --ag-foreground-color: var(--text); --ag-font-family: var(--f-body); --ag-font-size: 14px; --ag-cell-horizontal-padding: 12px;
  --ag-selected-row-background-color: #132536; --ag-active-color: var(--accent); --ag-input-focus-border-color: var(--accent);
  --ag-wrapper-border-radius: 0; --ag-input-border-color: var(--line); --ag-header-column-resize-handle-color: var(--line2);
}
.ag-theme-quartz-dark .ag-root-wrapper { border: 0; }
.ag-header-cell-text { font: 600 13px var(--f-display); text-transform: uppercase; letter-spacing: .07em; }
.ag-floating-filter-input input { font-family: var(--f-mono) !important; font-size: 12px !important; }
.ag-row { cursor: pointer; }
.ag-cell { display: flex; align-items: center; }
.ag-overlay-no-rows-wrapper * { pointer-events: auto; }
.cell-name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; }
.ours { display: inline-block; font: 700 10px var(--f-display); letter-spacing: .08em; color: var(--accent); border: 1px solid var(--accent); border-radius: 4px; padding: 0 4px; margin-left: 6px; vertical-align: 1px; }
.pos { display: inline-block; font: 600 11px/18px var(--f-display); letter-spacing: .06em; padding: 0 5px; border-radius: 4px; background: #1a2530; color: #a7bccb; margin-right: 3px; }
.abar { display: flex; align-items: center; gap: 8px; width: 100%; }
.abar .mono { width: 26px; text-align: right; font-weight: 700; }
.abar .tr { flex: 1; height: 4px; border-radius: 2px; background: #1c2731; position: relative; overflow: hidden; }
.abar .tr i { position: absolute; inset: 0 auto 0 0; border-radius: 2px; }
.abar .gap { font: 500 11px var(--f-mono); color: var(--muted); width: 28px; }
.role { display: flex; align-items: baseline; gap: 6px; min-width: 0; }
.role b { font-family: var(--f-mono); }
.role span { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.a1 { color: var(--bad); } .a2 { color: var(--warn); } .a3 { color: var(--ok); } .a4 { color: var(--good); font-weight: 700; }
.sk { display: block; height: 10px; width: 70%; border-radius: 4px; background: linear-gradient(90deg, #17202a 0%, #212c37 50%, #17202a 100%); background-size: 200% 100%; animation: shimmer 1.3s linear infinite; }
@keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }
.star-btn { width: 32px; height: 32px; display: grid; place-items: center; font-size: 17px; color: #34444f; border-radius: 6px; transition: color var(--t-fast); }
.star-btn:hover { color: var(--text2); }
.star-btn[aria-pressed="true"] { color: var(--gold); }
.star-btn.pop { animation: pop .35s var(--ease); }
@keyframes pop { 40% { transform: scale(1.45) rotate(-12deg); } }

/* Deal visuals */
.deal { display: inline-flex; align-items: center; gap: 6px; font: 700 12px var(--f-mono); padding: 2px 8px; border-radius: var(--r-pill); color: var(--c); background: color-mix(in srgb, var(--c) 14%, transparent); white-space: nowrap; }
.deal em { font: 700 10px var(--f-display); letter-spacing: .08em; text-transform: uppercase; font-style: normal; opacity: .9; }
.vf { display: flex; align-items: center; gap: 8px; width: 100%; }
.vf .tr { flex: 1; height: 6px; border-radius: 3px; background: #1c2731; position: relative; overflow: hidden; }
.vf .tr i { position: absolute; inset: 0 auto 0 0; background: var(--muted); border-radius: 3px; }
.vf .tr.over i { background: var(--bad); }
.vf .mono { font-size: 12px; min-width: 52px; text-align: right; }
.mini { font: 600 12px var(--f-mono); }

/* Empty states */
.empty { display: grid; place-items: center; text-align: center; gap: 6px; padding: 32px; color: var(--muted); }
.empty svg { width: 120px; height: auto; opacity: .9; }
.empty h3 { margin: 6px 0 0; font: 700 20px var(--f-display); letter-spacing: .03em; text-transform: uppercase; color: var(--text); }
.empty p { margin: 0; max-width: 360px; }
.panel-msg { position: absolute; inset: 0; display: grid; place-items: center; }

/* ---------- Drawer ---------- */
.drawer { position: fixed; top: var(--top); right: 0; bottom: 0; width: 460px; max-width: 100%; background: var(--panel); border-left: 1px solid var(--line); overflow-y: auto; z-index: 20; box-shadow: var(--shadow); transform: translateX(105%); transition: transform var(--t-slow) var(--ease); overscroll-behavior: contain; }
.drawer.open { transform: none; }
.dr-head { position: sticky; top: 0; z-index: 2; background: var(--panel); padding: 16px 18px 12px; border-bottom: 1px solid var(--line); }
.dr-row { display: flex; align-items: flex-start; gap: 6px; }
.dr-id { flex: 1; min-width: 0; }
.dr-id h2 { margin: 0; font: 700 26px/1.05 var(--f-display); letter-spacing: .01em; }
.dr-id p { margin: 3px 0 6px; color: var(--muted); font-size: 13px; }
.icon-btn { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 8px; color: var(--muted); font-size: 20px; }
.icon-btn:hover { background: var(--raise); color: var(--text); }
.icon-btn.star[aria-pressed="true"] { color: var(--gold); }
.hist { display: flex; gap: 2px; margin: 0 -6px; }
.hist .icon-btn svg { width: 18px; height: 18px; }
.hist .icon-btn[disabled] { opacity: .3; background: none; color: var(--muted); cursor: default; }
@keyframes grow { from { transform: scaleX(0); } }
/* Hero dials: the 2-4 numbers that matter in this mode, as rings under the sticky name */
.hero { margin: 0 -18px; padding: 16px 18px 14px; border-bottom: 1px solid var(--line); background: radial-gradient(120% 100% at 50% 0%, color-mix(in srgb, var(--mode) 10%, transparent), transparent 70%); }
.dials { display: grid; grid-template-columns: repeat(auto-fit, minmax(88px, 1fr)); gap: 10px 8px; }
.dial { position: relative; display: grid; justify-items: center; align-content: start; text-align: center; gap: 1px; min-width: 0; }
.dial svg { width: 76px; height: 76px; transform: rotate(-90deg); }
.dial circle { fill: none; stroke-width: 6; stroke-linecap: round; }
.dial .trk { stroke: #1a242d; }
.dial .arc { transform-origin: 32px 32px; animation: dial .8s var(--ease) both; }
@keyframes dial { from { transform: rotate(-120deg); opacity: 0; } }
.dial > b { position: absolute; top: 0; left: 0; right: 0; height: 76px; display: grid; place-items: center; font: 700 20px var(--f-mono); }
.dial > span { margin-top: 4px; font: 700 11px var(--f-display); letter-spacing: .08em; text-transform: uppercase; color: var(--text2); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dial small { font-size: 11px; line-height: 1.3; color: var(--muted); }
.hero .note { margin: 12px 0 0; text-align: center; }
.ticket { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.kv-h { display: flex; justify-content: space-between; align-items: center; gap: 6px; min-height: 20px; }
.kv-h .deal { text-transform: none; letter-spacing: 0; }
.ticket > div { background: var(--bg); border-radius: var(--r-sm); padding: 8px 10px; min-width: 0; }
.ticket .vf { margin-top: 6px; }
.ticket .vf::before { content: "fair"; font: 600 10px var(--f-display); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.ticket .vf .mono { min-width: 0; text-transform: none; letter-spacing: 0; color: var(--text2); }
.dr-body .tags.terms { margin-top: 10px; }
.dr-body { padding: 4px 18px 28px; }
.sec { padding: 16px 0; border-bottom: 1px solid var(--line); }
.sec:last-child { border-bottom: 0; }
.sec h3 { margin: 0 0 10px; font: 700 13px var(--f-display); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); display: flex; align-items: baseline; gap: 8px; }
.sec h3 small { font: 400 12px var(--f-body); letter-spacing: 0; text-transform: none; color: var(--faint); margin-left: auto; }
.tags { display: flex; flex-wrap: wrap; gap: 5px; }
.tag { font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: var(--r-pill); background: var(--raise); color: var(--text2); white-space: nowrap; }
.tag b { font-family: var(--f-mono); margin-left: 4px; }
.tag.good { background: var(--good-soft); color: var(--good); }
.tag.bad { background: var(--bad-soft); color: var(--bad); }
.tag.warn { background: var(--warn-soft); color: var(--warn); }
.price { display: grid; grid-template-columns: 1fr 1fr auto; gap: 4px 12px; align-items: end; }
.kv { font-size: 11px; font-family: var(--f-display); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.kv b { display: block; font: 700 18px var(--f-mono); color: var(--text); letter-spacing: 0; text-transform: none; }
.price .vf { grid-column: 1 / -1; margin-top: 6px; }
.facts { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-size: 13px; margin-top: 12px; }
.facts dt { color: var(--muted); } .facts dd { margin: 0; text-align: right; }
.lens-mini { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 10px; }
.lens-mini div { background: var(--bg); border-radius: var(--r-sm); padding: 6px 8px; font-size: 11px; color: var(--muted); }
.lens-mini b { display: block; font: 700 14px var(--f-mono); }
.radar-wrap { display: grid; grid-template-columns: 220px 1fr; gap: 10px; align-items: center; }
.radar { width: 220px; height: 220px; overflow: visible; }
.radar .shape { transform-origin: 110px 110px; animation: radar .6s var(--ease) both; }
@keyframes radar { from { transform: scale(.2); opacity: 0; } }
.radar text { font: 600 10px var(--f-display); letter-spacing: .06em; text-transform: uppercase; fill: var(--muted); }
.axes-list { font-size: 13px; display: grid; gap: 3px; }
.axes-list div { display: flex; justify-content: space-between; }
.axes-list b { font-family: var(--f-mono); }
.statline { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.stat { background: var(--bg); border-radius: var(--r-sm); padding: 5px 10px; font-size: 11px; color: var(--muted); font-family: var(--f-display); letter-spacing: .06em; text-transform: uppercase; }
.stat b { display: block; font: 700 16px var(--f-mono); color: var(--text); letter-spacing: 0; }
.pct { display: grid; grid-template-columns: 128px 1fr 44px 30px; align-items: center; gap: 8px; font-size: 13px; padding: 3px 0; }
.pct .lbl { color: var(--text2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pct .tr { height: 8px; border-radius: 4px; background: #1a242d; position: relative; }
.pct .tr::before { content: ""; position: absolute; left: 50%; top: -2px; bottom: -2px; width: 1px; background: var(--line2); }
.pct .tr i { position: absolute; inset: 0 auto 0 0; border-radius: 4px; transform-origin: left; animation: grow .6s var(--ease) both; }
.pct .v { font: 500 12px var(--f-mono); text-align: right; color: var(--muted); }
.pct .p { font: 700 12px var(--f-mono); text-align: center; border-radius: var(--r-pill); padding: 1px 0; background: color-mix(in srgb, currentColor 14%, transparent); }
.note { font-size: 12px; color: var(--faint); margin-top: 8px; }
.rolebar { display: grid; grid-template-columns: 150px 1fr 34px; align-items: center; gap: 8px; font-size: 13px; padding: 2px 0; }
.rolebar .tr { height: 5px; border-radius: 3px; background: #1a242d; overflow: hidden; }
.rolebar .tr i { display: block; height: 100%; border-radius: 3px; }
details summary { cursor: pointer; font: 700 13px var(--f-display); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); list-style: none; display: flex; align-items: center; gap: 8px; min-height: 32px; }
details summary::before { content: "+"; font: 700 15px var(--f-mono); color: var(--accent); width: 14px; }
details[open] summary::before { content: "−"; }
.attrs { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 24px; margin-top: 10px; }
.attrs h4 { margin: 0 0 4px; font: 700 12px var(--f-display); letter-spacing: .1em; text-transform: uppercase; color: var(--faint); }
.attrs .row { display: flex; justify-content: space-between; font-size: 13px; padding: 1px 0; }

/* ---------- Player profile page: the drawer's blocks laid out on two columns, plus the visuals only room allows ---------- */
.pp { flex: 1; min-height: 0; overflow-y: auto; }
.pp-in { max-width: 1400px; margin: 0 auto; padding: 0 20px 40px; }
.pp-head { position: sticky; top: 0; z-index: 4; display: flex; align-items: center; gap: 16px; padding: 16px 0 14px; margin-bottom: 14px; background: var(--bg); border-bottom: 1px solid var(--line); box-shadow: 0 1px 0 color-mix(in srgb, var(--mode) 30%, transparent); }
.pp-id { flex: 1; min-width: 0; }
.pp-id h1 { margin: 0; font: 700 34px/1 var(--f-display); letter-spacing: .01em; text-transform: uppercase; outline: none; }
.pp-id p { margin: 6px 0 8px; color: var(--muted); font-size: 13px; }
.pp-id .tags { display: inline-flex; margin-left: 6px; vertical-align: middle; }
.pp-act { display: flex; gap: 8px; align-items: center; }
.pp-grid { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 14px; align-items: start; }
.pp-card.sec { padding: 16px 18px; border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--panel); min-width: 0; }
.pp-card .sec { padding: 12px 0 0; border: 0; }
.pp-wide { grid-column: 1 / -1; }
.pp-card h4 { margin: 14px 0 6px; font: 700 12px var(--f-display); letter-spacing: .1em; text-transform: uppercase; color: var(--faint); }
.pp-hero { background: radial-gradient(120% 90% at 30% 0%, color-mix(in srgb, var(--mode) 10%, transparent), transparent 70%), var(--panel) !important; }
.pp-hero .note { margin-top: 10px; }
.pp-pos { display: grid; grid-template-columns: 170px minmax(0, 1fr); gap: 18px; align-items: start; }
.pp-pos .pitch { width: 170px; }
.pp-pos .legend { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
.pp-pos .legend .tag { font-size: 11px; padding: 2px 7px; }
.pp-pos .legend i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; vertical-align: 0; }
.hm { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 14px 22px; }
.hm h4 { margin: 0 0 6px; font: 700 12px var(--f-display); letter-spacing: .1em; text-transform: uppercase; color: var(--faint); }
.hm-g { display: grid; grid-template-columns: repeat(auto-fill, minmax(70px, 1fr)); gap: 4px; }
.hm-c { display: flex; justify-content: space-between; align-items: baseline; gap: 4px; padding: 5px 7px; border-radius: var(--r-sm); background: color-mix(in srgb, currentColor 13%, var(--bg)); font-size: 11px; }
.hm-c span { color: var(--text2); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hm-c b { font: 700 14px var(--f-mono); }
.pbar { margin: 4px 0 14px; }
.pbar-tr { position: relative; height: 14px; border-radius: 7px; background: #1a242d; }
.pbar-tr i { position: absolute; top: 0; bottom: 0; }
.pbar-tr .band { border-radius: 7px; background: color-mix(in srgb, var(--accent) 30%, transparent); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 55%, transparent); transform-origin: left; animation: grow .6s var(--ease) both; }
.pbar-tr .fair { width: 2px; margin-left: -1px; top: -4px; bottom: -4px; background: var(--accent); }
.pbar-tr .ask { width: 14px; height: 14px; margin-left: -7px; border-radius: 50%; background: var(--c); box-shadow: 0 0 0 3px var(--panel), 0 0 14px var(--c); }
.pbar-lg { display: flex; justify-content: space-between; gap: 10px; margin-top: 8px; font-size: 12px; color: var(--muted); }
.pbar-lg b { font-family: var(--f-mono); color: var(--text); }
.sim-row { display: grid; grid-template-columns: minmax(0, 1fr) auto 70px; align-items: center; gap: 10px; width: 100%; min-height: 44px; padding: 6px 8px; border-radius: var(--r-sm); text-align: left; }
.sim-row:hover { background: var(--raise); }
.sim-row b { font-weight: 600; }
.sim-row small { display: block; color: var(--muted); font-size: 12px; }
.sim-row .mono { text-align: right; }
@media (max-width: 1180px) {
  .pp-grid { grid-template-columns: minmax(0, 1fr); }
  .pp-in { padding-bottom: 84px; }
  .pp-act { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; justify-content: flex-end; padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); background: var(--panel); border-top: 1px solid var(--line); }
  .pp-id h1 { font-size: 28px; }
}
@media (max-width: 560px) { .pp-pos { grid-template-columns: 1fr; } .pp-in { padding: 0 16px 84px; } }

/* ---------- Palette ---------- */
dialog.pal { width: min(620px, calc(100vw - 32px)); max-height: min(560px, calc(100vh - 120px)); margin: 12vh auto auto; padding: 0; border: 1px solid var(--line2); border-radius: var(--r-lg); background: var(--panel); color: var(--text); box-shadow: var(--shadow); display: none; flex-direction: column; }
dialog.pal[open] { display: flex; animation: palIn var(--t) var(--ease); }
.load-body { padding: 16px 18px 18px; display: grid; gap: 12px; overflow-y: auto; }
.drop { display: grid; justify-items: center; gap: 6px; padding: 28px 16px; border: 2px dashed var(--line2); border-radius: var(--r); color: var(--muted); text-align: center; transition: border-color var(--t), background var(--t); }
.drop b { color: var(--text); font-size: 15px; }
.drop:hover, .drop.over { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
.load-saves { display: grid; gap: 6px; }
.load-saves .btn { justify-content: space-between; text-align: left; }
@keyframes palIn { from { transform: translateY(-8px) scale(.98); opacity: 0; } }
dialog::backdrop { background: rgba(3,6,9,.6); backdrop-filter: blur(2px); }
.pal-in { display: flex; align-items: center; gap: 10px; padding: 0 16px; border-bottom: 1px solid var(--line); }
.pal-in input { flex: 1; height: 52px; background: none; border: 0; outline: none; font-size: 16px; }
.pal-list { overflow-y: auto; padding: 6px; }
.pal-g { font: 700 11px var(--f-display); letter-spacing: .12em; text-transform: uppercase; color: var(--faint); padding: 10px 10px 4px; }
.pal-item { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 8px 10px; border-radius: 8px; min-height: 40px; }
.pal-item .l { font-weight: 600; white-space: nowrap; }
.pal-item .d { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
.pal-item.on { background: var(--accent-soft); box-shadow: inset 2px 0 0 var(--accent); }
.pal-item .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
.pal-foot { display: flex; gap: 14px; padding: 8px 16px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); }

/* ---------- Overlay & toast ---------- */
.overlay { position: fixed; inset: 0; z-index: 40; background: rgba(3,6,9,.78); display: grid; place-items: center; }
.overlay[hidden] { display: none; }
.drop-zone { border: 2px dashed var(--accent); border-radius: 22px; padding: 48px 72px; text-align: center; }
.drop-zone h2 { margin: 12px 0 4px; font: 700 28px var(--f-display); text-transform: uppercase; letter-spacing: .03em; }
.toast { position: fixed; left: 50%; bottom: 22px; transform: translate(-50%, 20px); opacity: 0; z-index: 50; background: var(--raise); border: 1px solid var(--line2); border-left: 3px solid var(--accent); padding: 10px 16px; border-radius: var(--r); box-shadow: var(--shadow); font-size: 14px; pointer-events: none; transition: all var(--t) var(--ease); max-width: 90vw; }
.toast.on { opacity: 1; transform: translate(-50%, 0); }
.toast.bad { border-left-color: var(--bad); } .toast.good { border-left-color: var(--good); }

/* ---------- My Club ---------- */
.club { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.club-head { display: flex; align-items: center; gap: 18px; padding: 12px 18px; border-bottom: 1px solid var(--line); background: var(--bg2); flex-wrap: wrap; }
.club-head h1 { margin: 0; font: 700 28px/1 var(--f-display); text-transform: uppercase; letter-spacing: .02em; }
.club-head .sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
.club-head .ctrls { margin-left: auto; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.club-grid { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(330px, 380px) minmax(280px, 330px) 1fr; }
.club-grid > section { min-height: 0; overflow-y: auto; padding: 14px 16px; border-right: 1px solid var(--line); }
.club-grid > section:last-child { border-right: 0; }
.col-title { margin: 0 0 10px; font: 700 13px var(--f-display); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.pitch { position: relative; aspect-ratio: 68 / 92; width: 100%; border-radius: var(--r-lg); overflow: hidden;
  background: repeating-linear-gradient(180deg, var(--pitch) 0 9.09%, var(--pitch2) 9.09% 18.18%); box-shadow: inset 0 0 0 1px #1d3d2a, inset 0 0 60px rgba(0,0,0,.45); }
.pitch > svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.slot { position: absolute; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; gap: 2px; width: 84px; padding: 2px; border-radius: 10px; transition: transform var(--t) var(--ease); animation: slotIn .45s var(--ease) both; }
@keyframes slotIn { from { opacity: 0; transform: translate(-50%, -30%); } }
.slot:hover { transform: translate(-50%, -50%) scale(1.06); }
.slot .disc { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font: 700 13px var(--f-mono); color: #04110a; background: var(--g, var(--muted)); box-shadow: 0 0 0 3px rgba(0,0,0,.35), 0 0 18px color-mix(in srgb, var(--g, #000) 45%, transparent); }
.slot .lbl { font: 700 10px var(--f-display); letter-spacing: .1em; color: rgba(255,255,255,.7); }
.slot .nm { font: 600 12px/1.1 var(--f-body); color: #fff; max-width: 84px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-shadow: 0 1px 3px #000; }
.slot .bk { font-size: 10px; color: rgba(255,255,255,.55); max-width: 84px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.slot[aria-pressed="true"] .disc { box-shadow: 0 0 0 3px var(--accent), 0 0 22px var(--accent); }
.slot.weak .disc { animation: pulse 2.2s ease-in-out infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 3px rgba(0,0,0,.35), 0 0 26px var(--bad); } }
.g-weak { --g: var(--bad); } .g-ok { --g: var(--warn); } .g-strong { --g: var(--good); } .g-none { --g: #6b7884; }
.slot-card { margin-top: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; }
.slot-card .chips .chip { height: 28px; min-width: 44px; padding: 0 6px; font-size: 12px; }
.person { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 6px 8px; border-radius: 8px; min-height: 44px; }
.person:hover { background: var(--raise); }
.person .who { flex: 1; min-width: 0; }
.person .who b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.person .who span { font-size: 12px; color: var(--muted); }
.fitbar { width: 70px; height: 5px; border-radius: 3px; background: #1a242d; overflow: hidden; }
.fitbar i { display: block; height: 100%; border-radius: 3px; }
.rank { display: grid; grid-template-columns: 22px 44px 1fr auto; gap: 8px; align-items: center; width: 100%; text-align: left; padding: 8px; border-radius: 8px; border-left: 3px solid var(--g); margin-bottom: 4px; background: var(--bg2); min-height: 48px; transition: background var(--t-fast); }
.rank:hover { background: var(--raise); }
.rank[aria-pressed="true"] { background: var(--accent-soft); }
.rank .i { font: 700 12px var(--f-mono); color: var(--faint); }
.rank .p { font: 700 14px var(--f-display); letter-spacing: .05em; text-align: center; padding: 2px 0; border-radius: 5px; background: color-mix(in srgb, var(--g) 18%, transparent); color: var(--g); }
.rank .w b { display: block; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rank .w span { font-size: 11px; color: var(--muted); }
.rank .f { font: 700 13px var(--f-mono); text-align: right; }
.rank .f small { display: block; font: 500 10px var(--f-body); color: var(--muted); }
.slot-list { max-height: 260px; overflow-y: auto; }
.pname { cursor: pointer; text-decoration: underline transparent; text-underline-offset: 3px; transition: text-decoration-color var(--t), color var(--t); }
.pname:hover, .pname:focus-visible { color: var(--accent); text-decoration-color: currentColor; }
.reco .keys { display: flex; flex-wrap: wrap; gap: 4px; justify-content: flex-end; }
.reco { display: grid; grid-template-columns: 26px minmax(150px, 1fr) auto auto auto 36px; gap: 12px; align-items: center; padding: 10px 8px; border-bottom: 1px solid var(--line); animation: slotIn .4s var(--ease) both; }
.reco:hover { background: var(--bg2); }
.reco .i { font: 700 13px var(--f-mono); color: var(--faint); text-align: right; }
.reco .nm { text-align: left; font-weight: 700; font-size: 15px; display: block; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.reco .nm:hover { color: var(--accent); }
.reco .meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
.reco .rep { font-size: 13px; }
.reco .rep .up { color: var(--good); font: 700 12px var(--f-mono); }
.reco .money { font-size: 12px; color: var(--text2); margin-bottom: 4px; }
.sk-card { height: 58px; margin-bottom: 6px; border-radius: 8px; }

@media (max-width: 1180px) {
  .club-grid { grid-template-columns: minmax(300px, 360px) 1fr; overflow-y: auto; }
  .club-grid > section:last-child { grid-column: 1 / -1; border-top: 1px solid var(--line); }
  .nav kbd, .search kbd, #palBtn kbd { display: none; }
  .lens { min-width: 0; }
}
@media (max-width: 760px) {
  body { overflow: auto; }
  .top { flex-wrap: wrap; height: auto; padding: 8px 16px; }
  .club-grid { display: block; }
  .reco { grid-template-columns: 22px 1fr 36px; } .reco > :nth-child(3), .reco > :nth-child(4), .reco > :nth-child(5) { grid-column: 2; } .reco .keys { justify-content: flex-start; }
  .drawer { width: 100%; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 1ms !important; animation-iteration-count: 1 !important; transition-duration: 1ms !important; }
}

/* ---------- Edit search: a scouting board. Rail of sections, live criteria strip, pitch, attribute tiles ---------- */
dialog.es { width: min(1180px, calc(100vw - 32px)); height: min(860px, calc(100vh - 40px)); padding: 0; border: 1px solid var(--line2); border-radius: var(--r-lg); background: var(--panel); color: var(--text); box-shadow: var(--shadow), inset 0 3px 0 color-mix(in srgb, var(--mode) 70%, transparent); overflow: hidden; }
dialog.es[open] { animation: palIn var(--t) var(--ease); }
@keyframes esIn { from { transform: scale(.85); opacity: 0; } }
@keyframes esTick { 40% { transform: translateY(-3px) scale(1.08); } }
.es-in { display: flex; flex-direction: column; height: 100%; margin: 0; }
.es-head { display: flex; align-items: center; gap: 12px; padding: 12px 18px 10px; }
.es-head h2 { margin: 0; font: 700 26px/1 var(--f-display); text-transform: uppercase; letter-spacing: .03em; }
.es-head .icon-btn { margin-left: auto; }
.es-strip { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; max-height: 70px; overflow-y: auto; padding: 8px 18px; border-block: 1px solid var(--line); background: var(--bg2); font-size: 12px; min-height: 43px; }
.es-strip > .muted { font-weight: 600; margin-right: 4px; }
.es-strip .crit-chip { animation: esIn var(--t) var(--ease); }
.es-strip .crit-chip button { min-width: 22px; height: 22px; border-radius: 50%; }
.es-main { flex: 1; min-height: 0; display: grid; grid-template-columns: 178px 1fr; }
.es-rail { border-right: 1px solid var(--line); padding: 14px 10px; display: flex; flex-direction: column; gap: 2px; overflow-y: auto; background: var(--bg2); }
.es-rail button { display: grid; grid-template-columns: 20px 1fr auto; align-items: center; gap: 8px; min-height: 44px; padding: 0 10px; border-radius: var(--r); text-align: left; color: var(--muted); font: 700 15px var(--f-display); letter-spacing: .06em; text-transform: uppercase; position: relative; transition: background var(--t-fast), color var(--t-fast); }
.es-rail button i { font: 500 10px var(--f-mono); font-style: normal; color: var(--faint); }
.es-rail button:hover { background: var(--raise); color: var(--text); }
.es-rail button[aria-current="true"] { color: var(--text); background: color-mix(in srgb, var(--mode) 12%, transparent); }
.es-rail button[aria-current="true"]::before { content: ''; position: absolute; left: -10px; top: 10px; bottom: 10px; width: 3px; border-radius: 0 3px 3px 0; background: var(--mode); }
.es-rail b { min-width: 22px; height: 20px; padding: 0 6px; border-radius: var(--r-pill); display: grid; place-items: center; font: 700 11px var(--f-mono); background: var(--mode); color: var(--accent-ink); }
.es-rail b:empty { background: none; }
.es-rail p { margin: auto 0 0; padding: 10px; font-size: 12px; color: var(--faint); line-height: 1.45; }
.es-body { position: relative; overflow-y: auto; padding: 4px 22px 40px; scroll-padding-top: 8px; }
.es-sec { padding: 18px 0 22px; border-bottom: 1px dashed var(--line); min-width: 0; }
.es-sec:last-child { border-bottom: 0; min-height: 100%; }
.es-sec h3 { margin: 0 0 14px; font: 700 21px/1 var(--f-display); letter-spacing: .05em; text-transform: uppercase; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; outline: none; }
.es-sec h3::before { content: attr(data-n); font: 500 11px var(--f-mono); color: var(--mode); letter-spacing: 0; }
.es-sec h3 small { font: 400 13px var(--f-body); letter-spacing: 0; text-transform: none; color: var(--muted); }
.es-tools { margin-left: auto; display: inline-flex; gap: 6px; align-items: center; font: 500 12px var(--f-body); letter-spacing: 0; text-transform: none; color: var(--faint); }
.es-sub { margin: 16px 0 8px; font: 700 12px var(--f-display); letter-spacing: .12em; text-transform: uppercase; color: var(--faint); display: flex; gap: 8px; align-items: baseline; }
.es-sub small { font: 400 12px var(--f-body); letter-spacing: 0; text-transform: none; }
.es-gen { display: grid; grid-template-columns: minmax(280px, 360px) 1fr; gap: 26px; align-items: start; }
/* mini pitch, attacking right */

.es-pitch > svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.pz { position: absolute; transform: translate(-50%, -50%); min-width: 44px; height: 32px; padding: 0 8px; border-radius: var(--r-pill); font: 700 13px var(--f-display); letter-spacing: .06em; color: var(--text2); background: rgba(11,15,19,.72); border: 1px solid rgba(255,255,255,.18); transition: background var(--t-fast), color var(--t-fast), transform var(--t) var(--ease), box-shadow var(--t); }

.es-note { margin-top: 6px; font-size: 12px; color: var(--faint); }

.dual-h { display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; color: var(--text2); }

.dual-h output.on { color: var(--mode); }
.dual-t { position: relative; height: 30px; }
.dual-t::before, .dual-t::after { content: ''; position: absolute; top: 13px; height: 4px; border-radius: 2px; pointer-events: none; }
.dual-t::before { left: 0; right: 0; background: var(--line2); }
.dual-t::after { left: var(--lo); right: calc(100% - var(--hi)); background: var(--mode); }
.dual-t input { position: absolute; inset: 0; width: 100%; height: 30px; margin: 0; background: none; pointer-events: none; -webkit-appearance: none; appearance: none; }
.dual-t input::-webkit-slider-runnable-track { background: none; height: 30px; }
.dual-t input::-webkit-slider-thumb { -webkit-appearance: none; pointer-events: auto; width: 22px; height: 22px; margin-top: 4px; border-radius: 50%; background: var(--text); border: 4px solid var(--mode); cursor: grab; transition: transform var(--t-fast); }
.dual-t input::-moz-range-thumb { pointer-events: auto; width: 14px; height: 14px; border-radius: 50%; background: var(--text); border: 4px solid var(--mode); cursor: grab; }
.dual-t input:active::-webkit-slider-thumb { transform: scale(1.15); cursor: grabbing; }
.dual-t input:focus-visible { outline: none; }
.dual-t input:focus-visible::-webkit-slider-thumb { box-shadow: 0 0 0 3px var(--panel), 0 0 0 5px var(--accent); }
.dual-t input:focus-visible::-moz-range-thumb { box-shadow: 0 0 0 3px var(--panel), 0 0 0 5px var(--accent); }
.dual-s { display: flex; justify-content: space-between; font: 500 10px var(--f-mono); color: var(--faint); }
/* fields */
.es-fields { display: grid; grid-template-columns: repeat(auto-fill, minmax(176px, 1fr)); gap: 12px 16px; }
.es-fields .fld input, .es-fields .fld select { width: 100%; height: 36px; }
.es-fields .fld { display: grid; gap: 5px; align-content: start; font-size: 13px; color: var(--text2); }
.es-sec input.in:not(:placeholder-shown), .es-sec select.in:has(option:checked:not([value=""])) { border-color: color-mix(in srgb, var(--mode) 65%, transparent); background: color-mix(in srgb, var(--mode) 6%, var(--bg)); }
.es-fields .fld:has(.es-pair) { grid-column: span 2; }
.es-pair { display: grid; grid-template-columns: 1fr 18px 1fr; align-items: center; gap: 4px; }
.es-pair > span { color: var(--faint); font: 500 12px var(--f-mono); text-align: center; }
.es-row { display: flex; flex-wrap: wrap; gap: 8px 22px; align-items: center; margin-top: 14px; }
.es-row .check { min-height: 32px; }
.nat-wrap { display: grid; grid-template-columns: minmax(220px, 300px) 1fr; gap: 18px; align-items: start; }
.nat-list { max-height: 230px; overflow-y: auto; border: 1px solid var(--line); border-radius: var(--r-sm); display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); }
.nat-list label { display: flex; align-items: center; gap: 8px; padding: 4px 10px; font-size: 13px; cursor: pointer; min-height: 36px; }
.nat-list label:hover { background: var(--raise); }
.nat-list label:has(:checked) { background: color-mix(in srgb, var(--mode) 12%, transparent); color: var(--text); }
.nat-list .n { margin-left: auto; font: 500 11px var(--f-mono); color: var(--faint); }
/* attribute tiles: the tile IS the slider (a native range stretched over it, so arrows / Home / End / Page keys work) */
.es-tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(128px, 1fr)); gap: 6px; }
.rg { --c: var(--line2); position: relative; display: flex; align-items: flex-start; justify-content: space-between; gap: 6px; height: 50px; padding: 7px 9px; border-radius: var(--r-sm); background: var(--bg); border: 1px solid var(--line); overflow: hidden; font-size: 12px; transition: border-color var(--t-fast); }
.rg::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 100%; transform-origin: left; transform: scaleX(var(--v, 0)); background: linear-gradient(90deg, color-mix(in srgb, var(--c) 4%, transparent), color-mix(in srgb, var(--c) 26%, transparent)); transition: transform var(--t-fast) var(--ease); pointer-events: none; }
.rg::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 6px; background: repeating-linear-gradient(90deg, transparent 0 calc(25% - 1px), var(--line2) calc(25% - 1px) 25%); pointer-events: none; }
.rg span { position: relative; color: var(--text2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.25; pointer-events: none; }
.rg output { position: relative; font: 700 19px/1 var(--f-mono); color: var(--faint); pointer-events: none; }
.rg.on { border-color: color-mix(in srgb, var(--c) 60%, transparent); }
.rg.on output { color: var(--c); }
.rg.on span { color: var(--text); }
.rg[data-t="1"] { --c: var(--bad); } .rg[data-t="2"] { --c: var(--warn); } .rg[data-t="3"] { --c: var(--ok); } .rg[data-t="4"] { --c: var(--good); }
.rg.top output { animation: esTick .4s var(--ease); text-shadow: 0 0 14px color-mix(in srgb, var(--gold) 70%, transparent); color: var(--gold); }
.rg input[type=range] { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: ew-resize; }
.rg:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
.rg:hover { border-color: var(--line2); }
.es-roles { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 0 14px; }
.es-roles .es-tiles { grid-template-columns: 1fr; }
.es-legend { display: inline-flex; gap: 10px; }
.es-legend i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 4px; }
/* footer */
.es-foot { display: flex; align-items: center; gap: 10px; padding: 10px 18px; border-top: 1px solid var(--line); flex-wrap: wrap; background: var(--bg2); }
.es-save { display: inline-flex; gap: 6px; }
.es-save .in { width: 170px; height: 36px; }
#esLive { display: inline-flex; align-items: baseline; gap: 6px; font: 500 13px var(--f-body); color: var(--muted); }
#esLive b { font: 700 28px/1 var(--f-display); color: var(--mode); letter-spacing: .02em; display: inline-block; }
#esLive.tick b { animation: esTick .3s var(--ease); }
#esLive.zero b { color: var(--warn); }
.dual:not(:has(output.on)) .dual-t::after { background: var(--faint); }
@media (max-width: 1180px) { .es-main { grid-template-columns: 150px 1fr; } .es-gen { grid-template-columns: minmax(250px, 320px) 1fr; } }
@media (max-width: 900px) { .es-gen, .nat-wrap { grid-template-columns: 1fr; } .es-pitch { max-width: 420px; } }
@media (prefers-reduced-motion: reduce) { .pz[aria-pressed="true"] { transform: translate(-50%, -50%); } }

/* ---------- Offers ---------- */
.offers { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(340px, 400px) 1fr; }
.offers > section { min-height: 0; overflow-y: auto; padding: 18px; }

.ac-wrap { position: relative; }

.ac-list { position: absolute; left: 0; right: 0; top: calc(100% + 4px); background: var(--raise); border: 1px solid var(--line2); border-radius: var(--r); box-shadow: var(--shadow); z-index: 10; padding: 4px; }
.ac-list:empty { display: none; }

.verdict { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }

.accept { font-weight: 700; color: var(--c); }
.gauge { position: relative; height: 96px; margin: 26px 24px 18px; }
.gauge .track { position: absolute; left: 0; right: 0; top: 40px; height: 10px; border-radius: 5px; background: linear-gradient(90deg, var(--good-soft), #1a242d 50%, var(--bad-soft)); }
.gauge .band { position: absolute; top: 36px; height: 18px; border-radius: 6px; background: color-mix(in srgb, var(--good) 22%, transparent); border: 1px solid color-mix(in srgb, var(--good) 55%, transparent); }
.mk { position: absolute; top: 0; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; font-size: 11px; white-space: nowrap; transition: left var(--t-slow) var(--ease); }
.mk i { width: 2px; height: 26px; background: var(--c); margin-top: 3px; }
.mk b { font: 700 12px var(--f-mono); color: var(--c); }
.mk span { color: var(--muted); font-family: var(--f-display); letter-spacing: .06em; text-transform: uppercase; }
.mk.below { top: 50px; flex-direction: column-reverse; } .mk.below i { margin: 0 0 3px; }
.mk.you i { width: 4px; border-radius: 2px; height: 30px; }
.tag.nfs { background: var(--bad-soft); color: var(--bad); font-family: var(--f-body); }
.vf .tr.na { background: repeating-linear-gradient(45deg, #1c2731 0 4px, #141c24 4px 8px); }
.cmp { display: grid; grid-template-columns: 1fr 1fr 1.3fr; gap: 10px 12px; align-items: end; }
.cmp .vf { align-self: center; }
.pkg { margin-top: 10px; font-size: 13px; color: var(--text2); display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.update { position: fixed; left: 16px; bottom: 16px; z-index: 50; padding: 10px 14px; border-radius: var(--r); background: var(--accent); color: #07090c; font-weight: 600; font-size: 13px; text-decoration: none; box-shadow: 0 6px 24px rgba(0,0,0,.4); }
.nfs-banner { display: flex; gap: 10px; align-items: center; padding: 10px 12px; margin-bottom: 14px; border-radius: var(--r); background: var(--bad-soft); color: var(--text2); font-size: 13px; }
.lens-mini span { font: 600 11px var(--f-mono); margin-left: 6px; }
.legend-row { display: flex; flex-wrap: wrap; gap: 6px 18px; margin: 0 0 6px; font-size: 12px; color: var(--muted); }
.legend-row i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.legend-row .band-dot { background: color-mix(in srgb, var(--good) 30%, transparent); border: 1px solid var(--good); }
.legend-row b { color: var(--text); }
.of-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 10px; }
.of-quick { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.lens-tbl { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 6px; }
.lens-tbl th { text-align: left; font: 700 11px var(--f-display); letter-spacing: .1em; text-transform: uppercase; color: var(--faint); padding: 4px 0; }
.lens-tbl td { padding: 6px 0; border-top: 1px solid var(--line); } .lens-tbl td.mono, .lens-tbl th.r { text-align: right; }
.notes { margin: 6px 0 0; padding-left: 18px; color: var(--text2); font-size: 14px; } .notes li { margin: 4px 0; }
.show-chip { display: inline-flex; align-items: center; gap: 8px; height: 30px; padding: 0 6px 0 12px; border-radius: var(--r-pill); background: var(--accent-soft); border: 1px solid rgba(74,163,255,.45); font-weight: 600; font-size: 13px; }
@media (max-width: 1600px) { .nav kbd { display: none; } }
@media (max-width: 1320px) { .top { gap: 10px; } #palBtn kbd, .nav kbd { display: none; } .nav button { white-space: nowrap; } .search { min-width: 130px; } }  /* room for the Fair prices toggle */

// fetch with retry: the backend may restart briefly.
async function api(path, body, tries = 4) {
  const opt = body === undefined ? {} : { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) };
  for (let i = 1; ; i++) {
    try {
      const r = await fetch(path, opt);
      if (r.status < 502 || i >= tries) return r;
    } catch (e) { if (i >= tries) throw e; }
    await sleep(700 * i);
  }
}

// ---------- Domain constants ----------

  ['sportsmanship', 'Sporting'], ['temperament', 'Level-headed'], ['adaptability', 'Adaptable'], ['controversy', 'Low controversy']];

  club_name: 'Club', contract_squad_status: 'Squad status', contract_end: 'Contract end', deal_ability: 'Ability deal',

  fair_wage_ability: 'Fair wage', fair_wage_attributes: 'Fair wage', fair_wage_form: 'Fair wage', fair_wage_stats: 'Fair wage', stat_score: 'Performance', key_attrs: 'Key attributes', key_stats: 'Key stats (per 90)', ...Object.fromEntries(SEASON), ...Object.fromEntries(P90_EXTRA), owner_club_reputation: 'Owner club rep.', attr_avg: 'Avg attribute' };
const label = c => LABELS[c] || c.replace(/^(attributes|personality|role|positions)_/, '').replaceAll('_', ' ').replace(/\b\w/g, m => m.toUpperCase());
const short = c => c.startsWith('attributes_') ? ABBR[c.slice(11)] || label(c) : label(c);
const money = v => v == null ? '–' : v >= 1e6 ? `£${(v / 1e6).toFixed(v >= 1e7 ? 0 : 1)}M` : v >= 1e3 ? `£${Math.round(v / 1e3)}k` : `£${Math.round(v)}`;
const wage = v => v == null ? '–' : (v >= 1e5 ? `£${Math.round(v / 1e3)}k` : v >= 1e3 ? `£${+(v / 1e3).toFixed(1)}k` : `£${Math.round(v)}`) + '/w';
const tier = (v, bad) => { if (v == null) return ''; const t = v <= 5 ? 1 : v <= 10 ? 2 : v <= 15 ? 3 : 4; return 'a' + (bad ? 5 - t : t); };
const C = { good: '#3fd98a', ok: '#c3d651', warn: '#f2b84b', orange: '#f08a4b', bad: '#ff6f6f', muted: '#8796a5', accent: '#4aa3ff', gold: '#f5c542' };
const abilityColor = v => v >= 160 ? C.good : v >= 130 ? C.ok : v >= 100 ? C.warn : v >= 70 ? C.orange : C.bad;
const scoreColor = v => v >= 75 ? C.good : v >= 65 ? C.ok : v >= 55 ? C.warn : C.muted;
const pctColor = v => v >= 80 ? C.good : v >= 60 ? C.ok : v >= 40 ? C.warn : v >= 20 ? C.orange : C.bad;

const dealColor = v => v >= 60 ? C.good : v >= 30 ? C.ok : v >= 0 ? C.muted : C.bad;
const dealTag = v => v >= 60 ? 'Steal' : v >= 30 ? 'Bargain' : v >= 0 ? 'Fair' : 'Over';
// ponytail: deal % can be extreme (e.g. -19960% on form); capped for display.
const pctTxt = v => v < -999 ? '−999%+' : `${v > 0 ? '+' : v < 0 ? '−' : ''}${Math.abs(Math.round(v))}%`;
const dealBadge = v => v == null ? '' : `<span class="deal" style="--c:${dealColor(v)}">${Math.min(999, Math.abs(Math.round(v)))}${v < -999 ? '+' : ''}% ${v >= 0 ? 'under' : 'over'} <em>${dealTag(v)}</em></span>`;
const valueVsFair = (val, fair, fmt = money) => {
  if (fair == null) return '';

  const over = val > fair, w = !fair ? 0 : over ? 100 : Math.max(2, val / fair * 100);
  return `<div class="vf" title="Actual ${fmt(val)} vs fair ${fmt(fair)}"><div class="tr${over ? ' over' : ''}"><i style="width:${w}%"></i></div><span class="mono">${fmt(fair)}</span></div>`;
};
// No transfer value = the club won't sell. Free agents genuinely cost no fee.
const NFS = '<span class="tag nfs" title="The game puts no price on him: his club will not sell">Not for sale</span>';
const FREE = '<span class="tag good">Free agent</span>';
const feeHTML = p => !p ? '' : p.free_agent ? FREE : p.transfer_value == null ? NFS : money(p.transfer_value);
const wageVerdict = (w, fair) => { if (w == null || !fair) return null; const r = w / fair;
  return r <= .8 ? ['Below fair wage', C.good] : r <= 1.15 ? ['Fair wage', C.accent] : r <= 1.5 ? ['Above fair wage', C.warn] : ['Well above fair wage', C.bad]; };
const posChips = v => (v || '').split(';').filter(Boolean).map(p => `<span class="pos">${esc(p)}</span>`).join('');
const abilityBar = (v, gap) => v == null ? '' : `<div class="abar"><span class="mono" style="color:${abilityColor(v)}">${v}</span><div class="tr"><i style="width:${v / 2}%;background:${abilityColor(v)}"></i></div>${gap != null ? `<span class="gap">+${gap}</span>` : ''}</div>`;

    return t ? '\u{1F3F4}' + [...t].map(c => String.fromCodePoint(0xE0000 + c.charCodeAt(0))).join('') + '\u{E007F}' : '\u{1F1EC}\u{1F1E7}'; }

const groupOf = p => p.stat_group || (META.roles && META.roles[p.best_role]) || ((p.positions_gk || 0) >= 15 ? 'GK' : 'CM');

function keyAttrs(d, n = 5) {

function radar(axes, max = 20, ring = 15) {

  const poly = v => axes.map((_, i) => pt(i, v).join(',')).join(' ');
  const shape = axes.map((a, i) => pt(i, a[1]).join(',')).join(' ');
  return `<svg class="radar" viewBox="0 0 220 220" role="img" aria-label="${axes.map(a => a[0] + ' ' + a[1].toFixed(0)).join(', ')}">
    ${[.25, .5, .75, 1].map(f => `<polygon points="${poly(f * max)}" fill="none" stroke="#1f2a35"/>`).join('')}
    <polygon points="${poly(ring)}" fill="none" stroke="#2f4152" stroke-dasharray="3 3"/>
    ${axes.map((_, i) => `<line x1="${cx}" y1="${cy}" x2="${pt(i, max)[0]}" y2="${pt(i, max)[1]}" stroke="#1f2a35"/>`).join('')}
    <polygon class="shape" points="${shape}" fill="color-mix(in srgb, var(--mode) 22%, transparent)" stroke="var(--mode)" stroke-width="2" stroke-linejoin="round"/>
    ${axes.map((a, i) => { const [x, y] = pt(i, max * 1.27); return `<text x="${x}" y="${y + 3}" text-anchor="${Math.abs(x - cx) < 8 ? 'middle' : x > cx ? 'start' : 'end'}">${a[0]}</text>`; }).join('')}

// Fills root's [data-sec=season] (and, in Moneyball, the percentile radar in [data-sec=profile]); alive() = still on screen.
async function renderSeason(p, grp, root, alive) {

    .map(([l, x, c]) => `<div class="stat">${l}<b style="${c ? 'color:' + c : ''}">${x ?? '–'}</b></div>`).join('');
  const keys = METRICS[grp] || METRICS.CM;
  sec.innerHTML = head + `<div class="statline">${line}</div>` + keys.map(() => `<div class="pct"><span class="sk" style="width:80%"></span><span class="sk" style="width:100%"></span><span></span><span></span></div>`).join('');

      <div class="tr">${pc != null ? `<i style="width:${Math.max(pc, 2)}%;background:${pctColor(pc)}"></i>` : ''}</div>
      <span class="v">${val.toFixed(dec)}${unit}</span><span class="p" style="color:${pc != null ? pctColor(pc) : C.muted}">${pc ?? '–'}</span></div>`];
  }).sort((a, b) => b[0] - a[0]).map(r => r[1]).join('');  // strengths first; stable sort keeps metric order when there are no percentiles
  sec.innerHTML = head + `<div class="statline">${line}</div>${rows}
    <p class="note">${small ? `Not enough minutes to compare (${p.s_minutes} of 900).` : pool ? `Benchmarked against ${pool.length} ${grp}s.` : 'Peer benchmark unavailable right now.'}</p>`;
  if (prof) {

    const best = Object.entries(pcs).filter(([k]) => k !== 'rating').sort((a, b) => b[1] - a[1]);
    prof.innerHTML = ax.length >= 3 ? `<h3>Performance profile <small>percentiles · dashed ring = 75th</small></h3>
      <div class="radar-wrap">${radar(ax, 100, 75)}<div class="axes-list">${best.slice(0, 3).map(([k, x]) => `<div><span class="muted">${M[k][0]}</span><b style="color:${pctColor(x)}">${x}</b></div>`).join('')}
      ${best.length > 3 ? `<div style="margin-top:6px"><span class="muted">Weakest: ${M[best.at(-1)[0]][0]}</span><b style="color:${pctColor(best.at(-1)[1])}">${best.at(-1)[1]}</b></div>` : ''}</div></div>`
      : `<h3>Performance profile</h3><p class="note" style="margin:0">${small ? 'Needs 900 min this season.' : 'Not enough peer data to draw a profile.'}</p>`;
  }
}

// The app's only call outside this computer: ask GitHub, once per launch, whether a newer release exists.
async function checkUpdate() {
  try {
    const { version } = await (await api('/api/status')).json();
    if (!version || version === 'dev') return;
    const r = await fetch('https://api.github.com/repos/absalom12/fm26-scout/releases/latest');
    if (!r.ok) return;
    const latest = ((await r.json()).tag_name || '').replace(/^v/, '');
    const n = v => v.split('.').map(x => parseInt(x, 10) || 0);
    const [a, b] = [n(latest), n(version)];
    const i = [0, 1, 2].find(k => a[k] !== b[k]);
    if (i === undefined || a[i] < b[i]) return;
    const el = document.createElement('a');
    el.className = 'update'; el.href = 'https://fm26-scout-site.bien-vu-server.workers.dev/'; el.target = '_blank'; el.rel = 'noopener';
    el.textContent = `FM26 Scout ${latest} is out (you have ${version}). Download it ↗`;
    document.body.append(el);
  } catch {}
}
