name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:  # build + tests only; no release unless run on a tag
permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            asset: ScoutSheet-mac.zip
          # Intel Macs: numpy has no universal2 wheel, so a separate x86_64 build.
          # ponytail: GitHub keeps Intel runners until macOS 15's end (about Aug 2027); drop this entry then.
          - os: macos-15-intel
            asset: ScoutSheet-mac-intel.zip
          - os: windows-latest
            asset: ScoutSheet-windows.zip
    runs-on: ${{ matrix.os }}
    env:
      APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}  # all Apple secrets optional: without them the Mac build stays unsigned
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pytest
      - name: Import Apple certificate
        if: runner.os == 'macOS' && env.APPLE_CERT_P12 != ''
        run: |
          echo "$APPLE_CERT_P12" | base64 --decode > cert.p12
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security import cert.p12 -k build.keychain -P "${{ secrets.APPLE_CERT_PASSWORD }}" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
          rm cert.p12
          echo "CODESIGN_IDENTITY=${{ secrets.APPLE_SIGN_IDENTITY }}" >> "$GITHUB_ENV"
      - if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: echo "${GITHUB_REF_NAME#v}" > VERSION
      - run: python build.py
      - if: runner.os == 'macOS'
        run: python tests/smoke.py dist/ScoutSheet.app/Contents/MacOS/ScoutSheet
      - if: runner.os == 'Windows'
        run: python tests/smoke.py dist/ScoutSheet/ScoutSheet.exe
      - name: Notarize and staple
        if: runner.os == 'macOS' && env.APPLE_CERT_P12 != ''
        run: |
          codesign --verify --deep --strict --verbose=2 dist/ScoutSheet.app
          ditto -c -k --keepParent dist/ScoutSheet.app notarize.zip
          xcrun notarytool submit notarize.zip --apple-id "${{ secrets.APPLE_ID }}" --team-id "${{ secrets.APPLE_TEAM_ID }}" --password "${{ secrets.APPLE_APP_PASSWORD }}" --wait
          xcrun stapler staple dist/ScoutSheet.app
      - if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/ScoutSheet.app ${{ matrix.asset }}
      - if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/ScoutSheet -DestinationPath ${{ matrix.asset }}
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with: { files: "${{ matrix.asset }}" }
